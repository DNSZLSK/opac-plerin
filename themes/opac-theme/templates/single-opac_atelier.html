<!-- wp:template-part {"slug":"header","tagName":"header"} /-->

<!-- wp:group {"tagName":"main","layout":{"type":"constrained"}} -->
<main class="wp-block-group">

    <!-- Breadcrumb -->
    <!-- wp:group {"align":"wide","className":"opac-breadcrumb-wrap","style":{"spacing":{"padding":{"top":"16px","right":"32px","bottom":"0","left":"32px"}}},"layout":{"type":"constrained","contentSize":"1080px"}} -->
    <div class="wp-block-group alignwide opac-breadcrumb-wrap" style="padding-top:16px;padding-right:32px;padding-bottom:0;padding-left:32px">
        <!-- wp:opac/breadcrumb /-->
    </div>
    <!-- /wp:group -->

    <!-- Detail layout (photo + content) -->
    <!-- wp:group {"align":"wide","className":"opac-detail","style":{"spacing":{"padding":{"top":"24px","right":"32px","bottom":"40px","left":"32px"}}},"layout":{"type":"constrained","contentSize":"1080px"}} -->
    <div class="wp-block-group alignwide opac-detail" style="padding-top:24px;padding-right:32px;padding-bottom:40px;padding-left:32px">

        <!-- Colonne gauche : photo placeholder -->
        <!-- wp:group {"className":"opac-detail-photo opac-card-cover"} -->
        <div class="wp-block-group opac-detail-photo opac-card-cover">
            <!-- wp:group {"className":"opac-card-cover-fill"} -->
            <div class="wp-block-group opac-card-cover-fill"></div>
            <!-- /wp:group -->
            <!-- wp:post-featured-image /-->
        </div>
        <!-- /wp:group -->

        <!-- Colonne droite : contenu -->
        <!-- wp:group {"className":"opac-detail-content"} -->
        <div class="wp-block-group opac-detail-content">

            <!-- wp:post-title {"level":1,"className":"opac-detail-title","fontFamily":"display"} /-->

            <!-- wp:paragraph {"className":"opac-detail-tagline","textColor":"muted","metadata":{"bindings":{"content":{"source":"opac/atelier-meta","args":{"key":"opac_tagline"}}}}} -->
            <p class="opac-detail-tagline has-muted-color has-text-color">Description longue de l'atelier.</p>
            <!-- /wp:paragraph -->

            <!-- Info grid : tarif + public -->
            <!-- wp:group {"className":"opac-info-grid","layout":{"type":"default"}} -->
            <div class="wp-block-group opac-info-grid">

                <!-- wp:group {"className":"opac-info-item","backgroundColor":"card"} -->
                <div class="wp-block-group opac-info-item has-card-background-color has-background">
                    <!-- wp:paragraph {"className":"opac-info-label","textColor":"muted"} -->
                    <p class="opac-info-label has-muted-color has-text-color">Tarif annuel</p>
                    <!-- /wp:paragraph -->
                    <!-- wp:paragraph {"className":"opac-info-value","metadata":{"bindings":{"content":{"source":"opac/atelier-meta","args":{"key":"opac_tarif_annuel"}}}}} -->
                    <p class="opac-info-value">335 € / an</p>
                    <!-- /wp:paragraph -->
                </div>
                <!-- /wp:group -->

                <!-- wp:group {"className":"opac-info-item","backgroundColor":"card"} -->
                <div class="wp-block-group opac-info-item has-card-background-color has-background">
                    <!-- wp:paragraph {"className":"opac-info-label","textColor":"muted"} -->
                    <p class="opac-info-label has-muted-color has-text-color">Public</p>
                    <!-- /wp:paragraph -->
                    <!-- wp:paragraph {"className":"opac-info-value","metadata":{"bindings":{"content":{"source":"core/post-meta","args":{"key":"opac_public"}}}}} -->
                    <p class="opac-info-value">Adultes</p>
                    <!-- /wp:paragraph -->
                </div>
                <!-- /wp:group -->

            </div>
            <!-- /wp:group -->

            <!-- Créneaux -->
            <!-- wp:group {"className":"opac-creneaux","backgroundColor":"card"} -->
            <div class="wp-block-group opac-creneaux has-card-background-color has-background">
                <!-- wp:paragraph {"className":"opac-creneaux-title","textColor":"muted"} -->
                <p class="opac-creneaux-title has-muted-color has-text-color">Créneaux par semaine</p>
                <!-- /wp:paragraph -->
                <!-- wp:opac/creneaux-list /-->
            </div>
            <!-- /wp:group -->

            <!-- Tag de disponibilité -->
            <!-- wp:opac/places-tag /-->

            <!-- Boutons inscription (dynamique via bloc serveur) + contact -->
            <!-- wp:group {"className":"opac-detail-actions","style":{"spacing":{"margin":{"top":"16px"},"blockGap":"8px"}},"layout":{"type":"flex","flexWrap":"wrap"}} -->
            <div class="wp-block-group opac-detail-actions" style="margin-top:16px">
                <!-- wp:opac/inscription-button /-->
                <!-- wp:buttons -->
                <div class="wp-block-buttons">
                    <!-- wp:button {"className":"is-style-opac-secondary"} -->
                    <div class="wp-block-button is-style-opac-secondary"><a class="wp-block-button__link wp-element-button" href="/contact/">Poser une question</a></div>
                    <!-- /wp:button -->
                </div>
                <!-- /wp:buttons -->
            </div>
            <!-- /wp:buttons -->

            <!-- Notice adhesion (statique) -->
            <!-- wp:paragraph {"className":"opac-notice-adhesion","textColor":"muted"} -->
            <p class="opac-notice-adhesion has-muted-color has-text-color">Adhésion annuelle requise (15 € Plérinais / 30 € extérieur / 10 € mineur), à régler sur place au secrétariat.</p>
            <!-- /wp:paragraph -->

            <!-- Notice speciale (Raku pour Ceramique, vide pour les autres) -->
            <!-- wp:paragraph {"className":"opac-detail-notice","metadata":{"bindings":{"content":{"source":"opac/atelier-meta","args":{"key":"opac_notice"}}}}} -->
            <p class="opac-detail-notice"></p>
            <!-- /wp:paragraph -->

        </div>
        <!-- /wp:group -->

    </div>
    <!-- /wp:group -->

    <!-- Section Réalisations : grille dynamique des opac_gallery_item liés (masquée si vide) -->
    <!-- wp:opac/gallery-grid /-->

    <!-- Section Animatrice -->
    <!-- wp:group {"tagName":"section","align":"wide","className":"opac-section-padded","style":{"border":{"top":{"color":"var:preset|color|border","width":"1px"}}},"layout":{"type":"constrained","contentSize":"1080px"}} -->
    <section class="wp-block-group alignwide opac-section-padded" style="border-top-color:var(--wp--preset--color--border);border-top-width:1px">

        <!-- wp:heading {"level":2,"className":"opac-section-title","fontFamily":"display","style":{"spacing":{"margin":{"bottom":"16px"}}}} -->
        <h2 class="wp-block-heading opac-section-title has-display-font-family" style="margin-bottom:16px">Animateur</h2>
        <!-- /wp:heading -->

        <!-- Carte animateur : bloc serveur (opac/atelier-animator) qui lit le champ
             Animateur et CALCULE les initiales de l'avatar, comme la grille d'equipe.
             Remplace l'ancien markup statique dont l'avatar etait un "." fige. -->
        <!-- wp:opac/atelier-animator /-->

    </section>
    <!-- /wp:group -->

</main>
<!-- /wp:group -->
